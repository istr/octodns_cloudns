name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfLo "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks

      - name: Scan history and working tree
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --config .gitleaks.toml .
          "$RUNNER_TEMP/gitleaks" dir --redact --no-banner --config .gitleaks.toml .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - python-version: '3.10'
            octodns-version: '1.22.0'
          - python-version: '3.12'
            octodns-version: '1.22.0'
          - python-version: '3.14'
            octodns-version: 'latest'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ '${{ matrix.octodns-version }}' = latest ]; then
            pip install -e '.[test]' --upgrade octodns
          else
            pip install -e '.[test]' 'octodns==${{ matrix.octodns-version }}'
          fi

      - name: Run tests
        run: pytest tests/ --disable-network -v
